<line x1='420' y1='120' x2='478' y2='120' stroke='#57606a' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='600' y1='120' x2='628' y2='120' stroke='#57606a' stroke-width='1.6' marker-end='url(#a)'/>
<text x='20' y='24' font-size='12' fill='#57606a'>The call only pays for its own tokens. The model weights are never changed.</text>
