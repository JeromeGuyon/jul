<text x='105.0' y='82' font-size='13' text-anchor='middle' fill='#1f2328'>"charged twice…"</text>
<rect x='20' y='140' width='170' height='70' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='105.0' y='162' font-size='12' text-anchor='middle' fill='#1f2328' font-weight='600'>option descriptions</text>
