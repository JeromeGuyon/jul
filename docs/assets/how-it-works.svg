<text x='685.0' y='152' font-size='12' text-anchor='middle' fill='#1f2328'>sales 0.01</text>
<line x1='190' y1='68' x2='248' y2='100' stroke='#57606a' stroke-width='1.6' marker-end='url(#a)'/>
