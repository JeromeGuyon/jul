<svg xmlns='http://www.w3.org/2000/svg' width='760' height='230' viewBox='0 0 760 230' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker></defs>
<rect width='760' height='230' rx='10' fill='#ffffff' stroke='#d0d7de'/>
