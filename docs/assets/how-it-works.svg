<text x='105.0' y='198' font-size='12' text-anchor='middle' fill='#1f2328'>computed once, cached</text>
<rect x='250' y='70' width='170' height='100' rx='8' fill='#ddf4ff' stroke='#54aeff'/>
<text x='335.0' y='98' font-size='12' text-anchor='middle' fill='#1f2328' font-weight='600'>any LLM or</text>
