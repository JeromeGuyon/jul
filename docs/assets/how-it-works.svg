<text x='540.0' y='143' font-size='12' text-anchor='middle' fill='#1f2328'>softmax / tau</text>
<rect x='630' y='55' width='110' height='130' rx='8' fill='#dafbe1' stroke='#4ac26b'/>
<text x='685.0' y='98' font-size='12' text-anchor='middle' fill='#1f2328' font-weight='600'>billing</text>
