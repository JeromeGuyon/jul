<text x='335.0' y='134' font-size='12' text-anchor='middle' fill='#1f2328'>hidden states,</text>
<text x='335.0' y='152' font-size='12' text-anchor='middle' fill='#1f2328'>no text generated</text>
<rect x='480' y='70' width='120' height='100' rx='8' fill='#fff8c5' stroke='#d4a72c'/>
