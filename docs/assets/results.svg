<text x='660' y='354' font-size='11' text-anchor='middle' fill='#57606a'>1</text>
<text x='240' y='74' font-size='13' text-anchor='end' fill='#1f2328'>wemm-4b</text>
<rect x='250' y='56' width='360' height='26' rx='4' fill='#2f81f7'/>
<text x='602' y='74' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.877</text>
<text x='740' y='74' font-size='12' text-anchor='end' fill='#57606a'>78 ms</text>
<text x='240' y='110' font-size='13' text-anchor='end' fill='#1f2328'>wemm-9b</text>
<rect x='250' y='92' width='354' height='26' rx='4' fill='#2f81f7'/>
<text x='596' y='110' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.863</text>
<text x='740' y='110' font-size='12' text-anchor='end' fill='#57606a'>138 ms</text>
<text x='240' y='146' font-size='13' text-anchor='end' fill='#1f2328'>wemm-4b-4bit (default)</text>
<rect x='250' y='128' width='351' height='26' rx='4' fill='#1f6feb'/>
<text x='593' y='146' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.857</text>
