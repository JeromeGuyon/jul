<text x='740' y='48' font-size='11' text-anchor='end' fill='#57606a'>p50</text>
<text x='20' y='390' font-size='11' fill='#57606a'>±3 points on each mean. JuL latencies on Apple Silicon; *Jev's includes the network.</text>
