<svg xmlns='http://www.w3.org/2000/svg' width='760' height='404' viewBox='0 0 760 404' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'>
<rect width='760' height='404' rx='10' fill='#ffffff' stroke='#d0d7de'/>
