<rect x='250' y='236' width='309' height='26' rx='4' fill='#8b949e'/>
<text x='551' y='254' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.753</text>
<text x='740' y='254' font-size='12' text-anchor='end' fill='#57606a'>246 ms*</text>
<text x='240' y='290' font-size='13' text-anchor='end' fill='#1f2328'>TF-IDF + SVM (no LLM, 1000 labels)</text>
<rect x='250' y='272' width='283' height='26' rx='4' fill='#d29922'/>
<text x='525' y='290' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.690</text>
<text x='740' y='290' font-size='12' text-anchor='end' fill='#57606a'>0.17 ms</text>
