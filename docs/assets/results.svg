<rect x='250' y='164' width='344' height='26' rx='4' fill='#2f81f7'/>
<text x='586' y='182' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.840</text>
<text x='740' y='182' font-size='12' text-anchor='end' fill='#57606a'>46 ms</text>
<text x='240' y='218' font-size='13' text-anchor='end' fill='#1f2328'>f2llm-1.7b</text>
<rect x='250' y='200' width='335' height='26' rx='4' fill='#2f81f7'/>
<text x='577' y='218' font-size='13' font-weight='600' text-anchor='end' fill='#ffffff'>0.817</text>
