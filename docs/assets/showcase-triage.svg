<rect width='760' height='34' rx='10' fill='#161b22'/><rect y='24' width='760' height='10' fill='#161b22'/>
<circle cx='20' cy='17' r='6' fill='#ff5f57'/><circle cx='40' cy='17' r='6' fill='#febc2e'/><circle cx='60' cy='17' r='6' fill='#28c840'/>
<text x='380.0' y='22' font-size='12' text-anchor='middle' fill='#8b949e' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>ticket-triage-scale: published run, Apple Silicon (condensed)</text>
<text x='20' y='58' font-size='14' fill='#e6edf3' font-weight='700' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>$ python ticket-triage-scale/run.py --n 50000</text>
<text x='20' y='79' font-size='14' fill='#8b949e' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>Loaded 50,000 tickets. Model: qwen3-embedding-0.6b</text>
<text x='20' y='121' font-size='14' fill='#30363d' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>======================================================</text>
<text x='20' y='142' font-size='14' fill='#e6edf3' font-weight='700' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Triaged 50,000 tickets in 668 s</text>
<text x='20' y='163' font-size='14' fill='#e6edf3' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Throughput : 75 tickets / second</text>
<text x='20' y='184' font-size='14' fill='#e6edf3' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Accuracy   : 82.9%</text>
<text x='20' y='205' font-size='14' fill='#3fb950' font-weight='700' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Cost       : $0.00  (100% local, nothing sent)</text>
<text x='20' y='226' font-size='14' fill='#30363d' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>======================================================</text>
<text x='20' y='268' font-size='14' fill='#e6edf3' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Extrapolated at this throughput:</text>
<text x='20' y='289' font-size='14' fill='#3fb950' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>     1,000,000 tickets  -&gt;  3.7 h   local, $0.00</text>
<text x='20' y='310' font-size='14' fill='#e6edf3' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>  Same volume on a hosted LLM API (50x parallel):</text>
<text x='20' y='331' font-size='14' fill='#f85149' xml:space='preserve' font-family='SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace'>     1,000,000 tickets  -&gt;  $400</text>
<text x='20' y='370' font-size='11' fill='#6e7681' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Condensed from the run published in usejul/jul-showcases. Hosted cost is the script's estimate: ~250 ms, ~$0.0004 per call.</text>
</svg>